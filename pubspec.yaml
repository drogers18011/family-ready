name: family_ready
description: A local browser prototype for a shared preparedness plan.
publish_to: none
version: 0.2.0+2

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: 2.5.6
  flutter_map: 8.3.2
  latlong2: 0.10.1
  url_launcher: 6.3.3
  file_selector: 1.1.0
  # Keep the download APIs used by this prototype stable.
  cross_file: 0.3.5+5

flutter:
  uses-material-design: true
