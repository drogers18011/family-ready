name: family_ready
description: Black Box, a local prototype for a shared preparedness plan.
publish_to: none
version: 0.5.0+8

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: 1.11.1
  shared_preferences: 2.5.6
  flutter_map: 8.3.2
  latlong2: 0.10.1
  url_launcher: 6.3.3
  file_selector: 1.1.0
  # Keep the download APIs used by this prototype stable.
  cross_file: 0.3.5+5
  # Imported offline guides are copied into persistent local storage.
  path_provider: 2.1.6
  open_filex: 5.0.0
  web: 1.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Barlow-OFL.txt
    - assets/fonts/BarlowCondensed-OFL.txt
    - assets/fonts/IBMPlexMono-OFL.txt
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
